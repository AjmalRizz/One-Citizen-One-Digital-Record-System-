<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- Outer Gold Border -->
  <rect width="600" height="300" fill="#FFBE29" />
  
  <!-- Left Hoist Stripes: Teal and Orange -->
  <!-- Teal / Green Stripe (Muslim community) -->
  <rect x="25" y="25" width="65" height="250" fill="#00534E" />
  <!-- Orange Stripe (Tamil community) -->
  <rect x="95" y="25" width="65" height="250" fill="#EB7400" />

  <!-- Maroon Field (Sinhalese community & national sovereignty) -->
  <rect x="175" y="25" width="400" height="250" fill="#8D153A" />

  <!-- 4 Sacred Bo Leaves (Pipila) in the 4 corners of the maroon field -->
  <!-- Top-Left Bo Leaf -->
  <path d="M190,40 C190,75 220,80 230,80 C230,70 225,40 190,40 Z" fill="#FFBE29" />
  <!-- Top-Right Bo Leaf -->
  <path d="M560,40 C560,75 530,80 520,80 C520,70 525,40 560,40 Z" fill="#FFBE29" />
  <!-- Bottom-Left Bo Leaf -->
  <path d="M190,260 C190,225 220,220 230,220 C230,230 225,260 190,260 Z" fill="#FFBE29" />
  <!-- Bottom-Right Bo Leaf -->
  <path d="M560,260 C560,225 530,220 520,220 C520,230 525,260 560,260 Z" fill="#FFBE29" />

  <!-- Golden Lion (Sinharaja) holding the Kastane sword -->
  <g transform="translate(370, 150) scale(2.2)">
    <!-- Kastane Sword -->
    <path d="M12,-26 L15,-26 L14,-6 L12,-6 Z" fill="#FFE082" />
    <rect x="11" y="-6" width="6" height="2" fill="#FFBE29" />
    <circle cx="14" cy="-3" r="1.5" fill="#FFBE29" />

    <!-- Foreleg holding sword -->
    <path d="M4,-4 C10,-8 15,-10 15,-5 C13,-1 8,1 4,0 Z" fill="#FFBE29" />

    <!-- Lion Head & Mane -->
    <path d="M8,-12 C10,-16 6,-20 0,-19 C-5,-18 -9,-14 -8,-8 C-8,-3 -5,0 0,0 C7,0 10,-5 8,-12 Z" fill="#FFBE29" />
    <path d="M6,-15 C11,-16 13,-12 12,-9 C10,-7 7,-8 6,-9 Z" fill="#FFBE29" />
    <circle cx="4" cy="-13" r="1.5" fill="#8D153A" />

    <!-- Lion Body -->
    <path d="M2,-2 C-3,-6 -12,-4 -17,2 C-20,7 -18,15 -12,17 C-3,19 5,13 6,4 Z" fill="#FFBE29" />

    <!-- Legs -->
    <path d="M-1,3 C2,9 4,14 5,20 C3,21 0,21 -1,16 C-3,11 -4,7 -1,3 Z" fill="#FFBE29" />
    <path d="M-15,8 C-19,11 -20,17 -18,22 C-16,23 -14,22 -14,19 C-15,15 -12,12 -10,10 Z" fill="#FFBE29" />
    <path d="M-9,11 C-11,15 -11,19 -9,22 C-7,22 -6,20 -7,18 C-7,15 -6,13 -9,11 Z" fill="#FFBE29" />

    <!-- Flourishing Lion Tail -->
    <path d="M-16,3 C-22,-3 -23,-13 -18,-17 C-15,-20 -12,-16 -15,-11 C-17,-7 -15,-2 -12,1 Z" fill="#FFBE29" />
    <path d="M-18,-17 C-22,-21 -17,-23 -14,-19 C-12,-16 -16,-15 -18,-17 Z" fill="#FFBE29" />
  </g>
</svg>
